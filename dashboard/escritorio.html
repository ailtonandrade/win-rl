<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritorio Emillion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020; --panel: #121a2e; --line: #26324d; --text: #eef2ff; --muted: #8a96b3;
    --long: #3b8cff; --short: #ff8a3d; --good: #2ee66b; --bad: #ff4d5e; --gold: #ffd166; --live: #ff3b47;
    --pix: "Press Start 2P", ui-monospace, monospace; --term: "VT323", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b1020; color: var(--text); font: 14px/1.25 var(--term); overflow: hidden; }
  .app { height: 100vh; display: grid; gap: 8px; padding: 8px;
         grid-template-columns: minmax(0, 1fr) clamp(240px, 22vw, 320px);
         grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top" "scene side"; }
  .box { background: var(--panel); border: 2px solid var(--line); border-radius: 4px; box-shadow: 0 3px 0 #000a; min-width: 0; }

  /* topo */
  .top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 8px 12px; }
  .titlebox, .scorebox { display: inline-flex; align-items: center; gap: 8px; }
  .title { font: 13px var(--pix); color: var(--gold); text-shadow: 2px 2px 0 #000; white-space: nowrap; }
  .badge { font: 8px var(--pix); padding: 4px 6px; border-radius: 3px; background: #26324d; color: #cfd8ff; }
  .badge.ao_vivo { background: #4a1015; color: #ff9aa2; } .badge.ao_vivo::before { content: "● "; color: var(--live); animation: blink 1s infinite; }
  .badge.treino { background: #3d2466; color: #d8b4ff; }
  @keyframes blink { 50% { opacity: .2; } }
  .score { font: 18px var(--pix); text-shadow: 2px 2px 0 #000; }
  .meta { font-size: 18px; color: var(--muted); white-space: nowrap; }
  .spacer { flex: 1; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  button, a.btn { font: 16px var(--term); background: #0b1020; color: var(--text); border: 2px solid var(--line);
                  border-radius: 3px; padding: 2px 8px; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { border-color: var(--gold); }
  .good { color: var(--good); } .bad { color: var(--bad); }

  /* cena 3D */
  .scene { grid-area: scene; position: relative; overflow: hidden; height: 100%; background: #0b1020; }
  .scene canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; cursor: grab; }
  .scene canvas:active { cursor: grabbing; }
  .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
  .bubble { transform-origin: 50% 100%; background: #fff; color: #333; border: 2px solid #000; border-radius: 4px; padding: 3px 7px 4px;
            font: 8px var(--pix); text-align: center; box-shadow: 0 2px 0 #0006; position: relative; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #000; border-bottom: 0; }
  .bubble.q::after { border-top-color: #7fd4ff; }
  .bubble .bar { height: 2px; margin-top: 3px; background: #999; width: 0; }
  .bubble.q { background: #0b0f15; color: #cfe9ff; border-color: #7fd4ff; font-size: 9px; }
  .pop { animation: pop .35s ease-out; } @keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .tag { font: 7px var(--pix); color: #fff; background: #000b; padding: 2px 5px 2px 7px; border-left: 3px solid; border-radius: 2px; }
  .mood { font-size: 15px; }
  .mood.throb { animation: throb .6s ease-in-out infinite alternate; } @keyframes throb { to { transform: scale(1.3); } }
  .float { font: 10px var(--pix); text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; animation: floatup 1.6s ease-out forwards; }
  @keyframes floatup { 0% { opacity: 0; translate: 0 8px; } 15% { opacity: 1; } 100% { opacity: 0; translate: 0 -60px; } }
  .camctl { position: absolute; right: 10px; bottom: 10px; z-index: 3; display: flex; gap: 6px; }
  .camctl button { font-size: 18px; padding: 2px 8px; background: #0b1020cc; }
  .camctl button.on { border-color: var(--gold); color: var(--gold); }
  .hint { position: absolute; left: 10px; top: 8px; z-index: 2; font-size: 15px; color: #cfd8ffaa; pointer-events: none; text-shadow: 1px 1px 0 #000; }
  .banner { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 3; font: 12px var(--pix); text-align: center;
            background: #0b1020ee; border: 2px solid var(--line); padding: 16px 20px; display: none; line-height: 1.8; }

  /* radio */
  .radio-panel { position: absolute; left: 12px; bottom: 12px; z-index: 4; width: min(300px, calc(100% - 24px)); display: none;
                 background: #2a1a12; border: 3px solid #6d4c33; border-radius: 8px; box-shadow: 0 4px 0 #000a, inset 0 0 0 2px #8a6a4a;
                 padding: 10px 12px; color: #ffe9c4; font: 16px var(--term); }
  .radio-panel.open { display: block; animation: fadein .25s; }
  @keyframes fadein { from { opacity: 0; } }
  .radio-panel .hd { display: flex; justify-content: space-between; align-items: center; font: 9px var(--pix); color: #ffd166; }
  .radio-panel .hd button { font: 14px var(--term); padding: 0 6px; background: #3a2418; border-color: #6d4c33; color: #ffe9c4; }
  .radio-panel .dial { margin: 8px 0; background: #0f1a0f; border: 2px solid #000; border-radius: 4px; padding: 4px 8px; overflow: hidden;
                       color: #7CFF7C; font: 18px var(--term); white-space: nowrap; text-shadow: 0 0 6px #4f4; }
  .radio-panel .dial span { display: inline-block; padding-left: 100%; animation: marquee 9s linear infinite; }
  .radio-panel .dial.off span { animation: none; padding-left: 0; color: #3a5a3a; text-shadow: none; }
  @keyframes marquee { to { transform: translateX(-100%); } }
  .radio-panel .row { display: flex; align-items: center; gap: 6px; }
  .radio-panel .row button { font: 18px var(--term); min-width: 36px; padding: 2px 6px; background: #3a2418; border-color: #6d4c33; color: #ffe9c4; flex: none; }
  .radio-panel .row button.big { min-width: 48px; background: #6d2f1f; }
  .radio-panel input[type=range] { flex: 1 1 auto; width: 100%; min-width: 0; margin: 0; accent-color: #ffd166; }
  .radio-panel .row span { flex: none; }

  /* lateral */
  .side { grid-area: side; display: grid; gap: 8px; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .side h3 { font: 9px var(--pix); color: var(--muted); margin: 0 0 8px; letter-spacing: .05em; }
  .lb { padding: 10px; }
  .lrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 19px; padding: 2px 0; }
  .av { width: 18px; height: 18px; border: 2px solid #000; box-shadow: 1px 1px 0 #000; }
  .lrow .v { font-family: var(--pix); font-size: 10px; }
  .lrow.mz { border-top: 2px dashed var(--line); margin-top: 4px; padding-top: 6px; }
  .feed { padding: 10px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .feed .list { overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 4px; min-height: 0; flex: 1;
                scrollbar-width: thin; scrollbar-color: #3a4452 transparent; padding-right: 4px; }
  .feed .list::-webkit-scrollbar { width: 6px; } .feed .list::-webkit-scrollbar-thumb { background: #3a4452; border-radius: 3px; }
  .ev { font-size: 17px; line-height: 1.15; background: #0b1020; border-left: 4px solid var(--line); padding: 3px 6px; white-space: normal; overflow-wrap: anywhere; flex: none; }
  .ev.win { border-color: var(--good); } .ev.loss { border-color: var(--bad); } .ev.info { border-color: var(--gold); }
  .ev.new { animation: fadein .5s; }

  @media (orientation: portrait), (max-width: 760px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; align-content: start; grid-template-columns: minmax(0, 1fr);
           grid-template-rows: auto auto auto; grid-template-areas: "top" "scene" "side"; }
    .scene { height: auto !important; aspect-ratio: 4 / 3.4; }
    .side { grid-template-rows: auto auto; } .feed .list { max-height: 260px; }
    .top { position: relative; flex-direction: column; justify-content: center; text-align: center; gap: 4px; padding: 10px 46px 8px; }
    .top .spacer { display: none; }
    .titlebox { flex-wrap: wrap; justify-content: center; }
    .title { font-size: 11px; white-space: normal; }
    #clock { white-space: normal; font-size: 16px; line-height: 1.1; }
    .score { font-size: 17px; }
    .ctl { position: absolute; top: 6px; right: 6px; }
    .ctl a.btn { font-size: 0; padding: 2px 6px; } .ctl a.btn::first-letter { font-size: 16px; }
    .hint { display: none; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/" } }</script>
</head>
<body>
<div class="app">
  <div class="box top">
    <span class="titlebox"><span class="title">🏢 ESCRITORIO EMILLION</span> <span class="badge" id="mode">-</span></span>
    <span class="meta" id="clock">--</span>
    <span class="scorebox"><span class="score" id="score">0</span> <span class="meta" id="score-unit">pts</span></span>
    <span class="spacer"></span>
    <div class="ctl"><a class="btn" href="time.html" title="graficos, rodadas e pregoes anteriores">📊 painel</a></div>
  </div>

  <div class="box scene" id="scene">
    <div class="labels" id="labels"></div>
    <div class="hint">arraste: girar · roda: zoom · botao direito: mover</div>
    <div class="camctl"><button id="cam-auto" title="girar sozinho">↻</button><button id="cam-reset" title="voltar a camera">🎥</button></div>
    <div class="banner" id="banner"></div>
    <div class="radio-panel" id="radio">
      <div class="hd"><span>📻 RADIO EMILLION 87.7 FM</span><button id="radio-close" title="fechar">×</button></div>
      <div class="dial off" id="radio-dial"><span id="radio-title">desligado · clique no play</span></div>
      <div class="row">
        <button id="radio-prev" title="musica anterior">⏮</button>
        <button id="radio-play" class="big" title="tocar / pausar">▶</button>
        <button id="radio-next" title="proxima musica">⏭</button>
        <span title="volume">🔊</span><input type="range" id="radio-vol" min="0" max="100" value="50">
      </div>
    </div>
  </div>

  <div class="side">
    <div class="box lb"><h3>RANKING DO DIA</h3><div id="leader"></div></div>
    <div class="box feed"><h3>ACONTECENDO</h3><div class="list" id="feed"></div></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

// ============================================================== dados e reproducao (mesmo formato do painel)
const $ = id => document.getElementById(id);
const TC = ['#ff6b6b', '#4dabf7', '#51cf66', '#fcc419', '#cc5de8', '#20c997', '#f783ac', '#94d82d', '#ffa94d', '#748ffc'];
const HAIR = ['#3b2314', '#f2d16b', '#1d1d1d', '#a0522d', '#d9d9d9', '#6b3fa0', '#b5651d', '#222', '#c0392b', '#444'];
const SKIN = ['#f1c27d', '#ffdbac', '#c68642', '#e0ac69', '#8d5524', '#f1c27d', '#ffdbac', '#c68642', '#e0ac69', '#8d5524'];
const fmt = (v, d = 0) => v == null || isNaN(v) ? '-' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (v, d = 0) => v == null || isNaN(v) ? '-' : (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), d);
let index = null, ep = null, epId = null, byI = new Map(), p = 0, lastTick = 0, stamp = 0, prev = null;
const live = () => index && index.mode === 'ao_vivo';
const studyMode = () => index && index.mode === 'treino' && !!index.team?.traders;
const REPLAY_SPEED = 6;
async function getJSON(u) { const r = await fetch(u + '?t=' + Date.now()); if (!r.ok) throw new Error(r.status); return r.json(); }

async function poll() {
  try {
    const idx = await getJSON('data/index.json');
    if (idx.updated === stamp) return;
    stamp = idx.updated; index = idx;
    renderProvasTV();
    $('mode').textContent = { treino: 'TREINO', replay: 'REPLAY', ao_vivo: 'AO VIVO' }[idx.mode] || idx.mode;
    $('mode').className = 'badge ' + idx.mode;
    if (studyMode()) {
      banner(null);
      const tn = idx.team.traders.map(x => x.name);
      if (!W3.names || W3.names.join() !== tn.join()) buildTeam(tn);
      renderStudy();
      return;
    }
    const newest = idx.episodes.at(-1);
    if (!newest) return banner(live() ? 'AGUARDANDO O MERCADO' : 'AGUARDANDO O TIME', idx.live?.status || 'rode o run.bat');
    banner(null);
    if (live()) { await load(newest.id); return; }
    if (!ep || W3.studying) await load(idx.episodes[0].id);
  } catch (e) { console.error(e); banner('SEM DADOS', 'rode o run.bat'); }
}
function banner(a, b) { $('banner').style.display = a ? 'block' : 'none'; if (a) $('banner').innerHTML = a + '<br><span style="font-size:9px;color:#8a96b3">' + (b || '') + '</span>'; }

async function load(id) {
  const meta = index.episodes.find(e => e.id === id); if (!meta) return;
  const fresh = id !== epId;
  ep = await getJSON('data/' + meta.file);
  byI = new Map(ep.steps.map(s => [s.i, s])); epId = id;
  if (fresh || W3.studying || !W3.names || W3.names.join() !== ep.team.names.join()) {
    if (!W3.names || W3.names.join() !== ep.team.names.join()) buildTeam(ep.team.names);
    W3.studying = false; prev = null; $('feed').innerHTML = ''; p = live() ? ep.bars.length - 1 : 0;
  }
  if (live()) p = ep.bars.length - 1;
  render();
}

// ============================================================== mundo 3D
const W = 13, D = 9, H = 4, DESK_W = 1.9, DESK_D = .95, DESK_H = .75, MON_X = .7, MON_W = .82, SEAT_DX = MON_X + MON_W / 2 + .12;
const DESKS = [[1.6, 1.5], [4.5, 1.5], [7.4, 1.5], [3.0, 4.6], [5.9, 4.6]];
const QC = [0.82, 0.74];
const COOLER_SPOT = [11.75, 1.35];
const W3 = { agents: [], names: null, studying: false, labels: [], confetti: [], timers: [] };

const sceneEl = $('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
sceneEl.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#79c3ff');
scene.fog = new THREE.Fog('#79c3ff', 60, 220);
const camera = new THREE.PerspectiveCamera(40, 1, .1, 600);
const HOME = { pos: new THREE.Vector3(16.5, 11.5, 16), target: new THREE.Vector3(6, .8, 4) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true; controls.dampingFactor = .08;
controls.minDistance = 5; controls.maxDistance = 45; controls.maxPolarAngle = 1.48;
controls.autoRotateSpeed = .6;
$('cam-reset').onclick = () => { zoomTarget = null; camera.position.copy(HOME.pos); controls.target.copy(HOME.target); controls.update(); };
// zoom suave: a roda/touchpad so define um alvo de distancia; a camera desliza ate ele a cada quadro
let zoomTarget = null;
renderer.domElement.addEventListener('wheel', e => {
  e.preventDefault(); e.stopImmediatePropagation();          // nao deixa o zoom "em degraus" do OrbitControls nem o zoom da pagina
  const dy = e.deltaY * (e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? 400 : 1);
  const k = e.ctrlKey ? .012 : .0012;                         // pinca no touchpad chega como wheel + ctrlKey, com deltas pequenos
  const cur = camera.position.distanceTo(controls.target);
  zoomTarget = THREE.MathUtils.clamp((zoomTarget ?? cur) * Math.exp(dy * k), controls.minDistance, controls.maxDistance);
}, { passive: false, capture: true });
function smoothZoom(dt) {
  if (zoomTarget == null) return;
  const off = camera.position.clone().sub(controls.target), cur = off.length();
  const nd = cur + (zoomTarget - cur) * (1 - Math.exp(-dt * 8));
  off.setLength(nd); camera.position.copy(controls.target).add(off);
  if (Math.abs(zoomTarget - nd) < .005) zoomTarget = null;
}
$('cam-auto').onclick = () => { controls.autoRotate = !controls.autoRotate; $('cam-auto').classList.toggle('on', controls.autoRotate); };

function resize() {
  const w = sceneEl.clientWidth, h = sceneEl.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(sceneEl);

// ---------- ajudantes
const MATS = new Map();
const mat = (c, o = {}) => {
  const k = c + JSON.stringify(o);
  if (!MATS.has(k)) MATS.set(k, new THREE.MeshStandardMaterial({ color: c, roughness: .85, metalness: 0, ...o }));
  return MATS.get(k);
};
const BOXG = new THREE.BoxGeometry(1, 1, 1);
// caixa pelo canto minimo (x, y, z) com tamanho (w, h, d)
function cube(parent, x, y, z, w, h, d, m, shadow = true) {
  const mesh = new THREE.Mesh(BOXG, typeof m === 'string' ? mat(m) : m);
  mesh.scale.set(w, h, d); mesh.position.set(x + w / 2, y + h / 2, z + d / 2);
  mesh.castShadow = shadow; mesh.receiveShadow = true;
  parent.add(mesh); return mesh;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4; const o = { c, ctx, tex, draw: (...a) => { draw(ctx, w, h, ...a); tex.needsUpdate = true; } };
  return o;
}
function plane(parent, w, h, m, x, y, z, ry = 0) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  mesh.position.set(x, y, z); mesh.rotation.y = ry; parent.add(mesh); return mesh;
}

// ---------- luzes
const hemi = new THREE.HemisphereLight('#dbeaff', '#5a4630', .9); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff4dd', 1.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 80 });
sun.shadow.bias = -.0005;
sun.target.position.set(6.5, 0, 4.5); scene.add(sun, sun.target);
const lamps = [[2.5, 3.4, .5], [6.6, 3.4, .5], [.5, 3.4, 4.5], [12.4, 3.4, 4.5]].map(([x, y, z]) => {
  const l = new THREE.PointLight('#ffd9a0', .3, 9, 1.6); l.position.set(x, y, z); scene.add(l); return l;
});

// ---------- predio e cidade la embaixo
const city = new THREE.Group(); scene.add(city);
const GROUND_Y = -70;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), mat('#3d4450'));
ground.rotation.x = -Math.PI / 2; ground.position.y = GROUND_Y; ground.receiveShadow = true; city.add(ground);
const roadMat = mat('#22252b');
[[-14, 0], [24, 0]].forEach(([z]) => { const r = new THREE.Mesh(new THREE.PlaneGeometry(500, 9), roadMat); r.rotation.x = -Math.PI / 2; r.position.set(0, GROUND_Y + .05, z); city.add(r); });
[[-12], [28]].forEach(([x]) => { const r = new THREE.Mesh(new THREE.PlaneGeometry(9, 500), roadMat); r.rotation.x = -Math.PI / 2; r.position.set(x, GROUND_Y + .06, 0); city.add(r); });
// a torre do nosso escritorio
cube(city, -.4, GROUND_Y, -.4, W + .8, -GROUND_Y - .3, D + .8, mat('#5c6b80', { roughness: .4, metalness: .3 }), false);
for (let y = GROUND_Y + 2; y < -1; y += 3.2) cube(city, -.45, y, -.45, W + .9, .25, D + .9, '#3a4555', false);
const winTex = canvasTex(64, 128, (ctx, w, h) => {
  ctx.fillStyle = '#2b3445'; ctx.fillRect(0, 0, w, h);
  for (let y = 4; y < h; y += 8) for (let x = 4; x < w; x += 8) { ctx.fillStyle = Math.random() < .55 ? '#ffe08a' : '#1a2030'; ctx.fillRect(x, y, 4, 5); }
});
winTex.draw(); winTex.tex.wrapS = winTex.tex.wrapT = THREE.RepeatWrapping;
const bldMats = ['#7d8ba8', '#5d6b88', '#8a94a6', '#4b5875', '#6f7b8f'].map(c => new THREE.MeshStandardMaterial({ color: c, roughness: .7, emissive: '#ffffff', emissiveMap: winTex.tex, emissiveIntensity: 0 }));
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
for (let i = 0; i < 90; i++) {
  const x = (rnd() - .5) * 260, z = (rnd() - .5) * 260;
  if (Math.abs(x - 6) < 22 && Math.abs(z - 4) < 22) continue;
  if (Math.abs(z + 14) < 8 || Math.abs(z - 24) < 8 || Math.abs(x + 12) < 8 || Math.abs(x - 28) < 8) continue;
  const w = 8 + rnd() * 14, d = 8 + rnd() * 14, h = 15 + rnd() * (Math.hypot(x, z) < 90 ? 90 : 45);
  const m = bldMats[i % bldMats.length].clone(); m.emissiveMap = winTex.tex.clone(); m.emissiveMap.needsUpdate = true;
  m.emissiveMap.repeat.set(Math.max(1, w / 6), Math.max(1, h / 10));
  const b = cube(city, x - w / 2, GROUND_Y, z - d / 2, w, h, d, m, false); b.receiveShadow = false;
}
W3.bldMats = city.children.filter(o => o.material?.emissiveMap).map(o => o.material);

    w.drink += dt; a.cup.visible = true; a.arms[1].rotation.x = w.drink % 1.2 < .6 ? 2.2 : 1.4;
    a.person.rotation.y = 0;                               // de frente pro bebedouro (que fica no fundo)
    if (!w.said) { w.said = true; floatAt(a.headPos(), ['glub glub 💧', 'ahhh 💧', 'hidratando 💧'][Math.floor(Math.random() * 3)], '#8fd3ff', 11); }
    if (w.drink > 2.6) { w.drank = true; a.cup.visible = false; a.arms[1].rotation.x = 0; }
    return;
  }
  const [x0, z0] = w.path[w.seg], [x1, z1] = w.path[w.seg + 1], len = Math.hypot(x1 - x0, z1 - z0) || .01;
  w.t += dt * 1.6 / len;
  if (w.t >= 1) { w.t = 0; w.seg++; if (w.seg >= w.path.length - 1) return endWalk(); return; }
  const x = x0 + (x1 - x0) * w.t, z = z0 + (z1 - z0) * w.t;
  a.person.position.set(x - a.x, 0, z - a.z);
  a.person.rotation.y = Math.atan2(-(x1 - x0), -(z1 - z0));
  const sw = Math.sin(performance.now() / 110) * .6;
  a.legs[0].rotation.x = sw; a.legs[1].rotation.x = -sw; a.arms[0].rotation.x = -sw * .7; a.arms[1].rotation.x = sw * .7;
}
function endWalk() { const a = W3.walk.a; sit(a); a.bubble.hidden = false; a.mood.hidden = false; W3.walk = null; W3.nextWalk = performance.now() + 8000 + Math.random() * 12000; }
function maybeWalk(now) {
  if (W3.walk || !W3.agents.length) return;
  if (!W3.nextWalk) W3.nextWalk = now + 5000 + Math.random() * 6000;
  if (now < W3.nextWalk) return;
  const st = ep && !studyMode() ? byI.get(Math.min(p, ep.bars.length - 1)) : null;
  const free = W3.agents.filter((a, j) => studyMode() || !st || (st.tr[j].pos === 0 && st.tr[j].want === 0));
  if (!free.length) { W3.nextWalk = now + 3000; return; }
  startWalk(free[Math.floor(Math.random() * free.length)]);
}

// ============================================================== Radio Emillion 87.7 FM (musica gerada no navegador)
const Radio = (() => {
  const TRACKS = [
    { name: 'Bossa do Spread', bpm: 104, swing: 0, lead: 'piano',
      chords: [[36, 'maj7'], [45, 'm7'], [38, 'm7'], [43, 'd7'], [40, 'm7'], [45, 'd7'], [38, 'm7'], [43, 'd7']],
      comp: [0, 1.5, 3], bass: [[0, 0], [1.5, 7], [2, 0], [3.5, 7]], clave: [0, 1.5, 3, 5, 6.5], mel: [0, 2, 3, 6], seed: 11 },
    { name: 'Lounge do Stop Loss', bpm: 80, swing: .32, lead: 'vibes',
      chords: [[41, 'maj7'], [40, 'm7'], [45, 'd7'], [38, 'm7'], [43, 'm7'], [36, 'd7'], [41, 'maj7'], [36, 'd7']],
      comp: [0, 2, 3.5], bass: [[0, 0], [1, 7], [2, 12], [3, 7]], clave: [1, 3, 5, 7], mel: [0, 3, 4, 5], seed: 5 },
  ];
  const Q = { maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], d7: [0, 4, 7, 10] };
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  let ctx = null, bus, master, noise, playing = false, timer = null, nextT = 0, step = 0, track = 0, vol = .5, notesTimer = null, melody = [];
  try { const sv = JSON.parse(localStorage.getItem('radioEmillion') || '{}'); if (sv.vol != null) vol = sv.vol; if (sv.track != null) track = sv.track % TRACKS.length; } catch (e) {}
  const save = () => { try { localStorage.setItem('radioEmillion', JSON.stringify({ vol, track })); } catch (e) {} };
  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = vol * .55;
    const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination);
    bus = ctx.createGain(); bus.connect(master);
    const verb = ctx.createConvolver(), len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    verb.buffer = ir; const wet = ctx.createGain(); wet.gain.value = .28; bus.connect(verb); verb.connect(wet); wet.connect(master);
    noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  function env(g, t, a, peak, dur, rel = .25) {
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(peak * .25, .0001), t + Math.max(dur, a + .02));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur + rel);
  }
  function tone(type, f, t, dur, peak, dest = bus, a = .01) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.value = f;
    env(g, t, a, peak, dur); o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .4);
  }
  const epiano = (m, t, dur, v) => { tone('sine', mtof(m), t, dur, v); tone('sine', mtof(m) * 2, t, dur * .35, v * .22); tone('triangle', mtof(m) * 4, t, .08, v * .05); };
  function vibes(m, t, dur, v) {
    const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
    o.type = 'sine'; o.frequency.value = mtof(m); lfo.frequency.value = 5.5; lg.gain.value = v * .35;
    lfo.connect(lg); lg.connect(g.gain); env(g, t, .005, v, dur + .5, .6);
    o.connect(g); g.connect(bus); o.start(t); lfo.start(t); o.stop(t + dur + 1.2); lfo.stop(t + dur + 1.2);
    tone('sine', mtof(m) * 4, t, .12, v * .08);
  }
  function bass(m, t, dur, v) {
    const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = mtof(m); lp.type = 'lowpass'; lp.frequency.value = 700;
    env(g, t, .01, v, dur, .08); o.connect(lp); lp.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + .2);
  }
  function hit(t, v, hp, dur) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noise; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t + dur + .02);
  }
  const rim = (t, v) => { tone('square', 1750, t, .015, v * .25); hit(t, v * .4, 2500, .03); };
  function chime(t) { [[76, 0], [72, .55]].forEach(([m, dt]) => { tone('sine', mtof(m), t + dt, 1.4, .22); tone('sine', mtof(m) * 2.76, t + dt, .5, .04); }); }
  function buildMelody(tr) {
    let s = tr.seed; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const out = []; let last = 74;
    tr.chords.forEach(([root, q], bar) => {
      const pool = [];
      for (const o of [24, 36]) for (const iv of Q[q].concat([2, 9])) pool.push(root + o + iv);
      const cand = pool.filter(m => m >= 67 && m <= 84).sort((a, b) => Math.abs(a - last) - Math.abs(b - last));
      tr.mel.forEach((pos8, i) => {
        if (bar % 4 === 3 && i > 1) return;
        const pick = cand[Math.min(cand.length - 1, Math.floor(r() * 3))]; last = pick;
        const nextPos = tr.mel[i + 1] ?? 8; out.push([bar * 8 + pos8, pick, (nextPos - pos8) * .5 * .9]);
      });
    });
    return out;
  }
  function scheduleStep(st, t) {
    const tr = TRACKS[track], bar = Math.floor(st / 8), beat = (st % 8) / 2;
    const [root, q] = tr.chords[bar], spb = 60 / tr.bpm;
    if (st % 2) t += tr.swing * spb * .5;
    if (tr.comp.includes(beat)) Q[q].forEach((iv, i) => epiano(root + 24 + iv - (iv > 7 && i === 3 ? 12 : 0), t + i * .008, spb * .9, .07));
    for (const [b, iv] of tr.bass) if (b === beat) bass(root + iv, t, spb * .45, .3);
    hit(t, st % 2 ? .05 : .025, 7000, .04);
    if (tr.clave.includes((bar % 2) * 4 + beat)) rim(t, .18);
    for (const [s8, m, dur] of melody) if (s8 === st) (tr.lead === 'vibes' ? vibes : epiano)(m, t, dur * spb * 2, tr.lead === 'vibes' ? .1 : .085);
  }
  function tick() { const spb = 60 / TRACKS[track].bpm; while (nextT < ctx.currentTime + .15) { scheduleStep(step, nextT); nextT += spb / 2; step = (step + 1) % 64; } }
  function startTrack(withIntro) {
    melody = buildMelody(TRACKS[track]); step = 0;
    nextT = ctx.currentTime + (withIntro ? 2.2 : .1);
    if (withIntro) chime(ctx.currentTime + .05);
    updateUI();
  }
  function play() {
    if (!ctx) init();
    ctx.resume(); playing = true; startTrack(true);
    clearInterval(timer); timer = setInterval(tick, 25);
    clearInterval(notesTimer);
    notesTimer = setInterval(() => floatAt(new THREE.Vector3(10.15 + (Math.random() - .5) * .4, 2.95, .4), Math.random() < .5 ? '♪' : '♫', ['#ffd166', '#7fd4ff', '#ff9aa2'][Math.floor(Math.random() * 3)], 15), 650);
    syncLed();
  }
  function pause() { playing = false; clearInterval(timer); clearInterval(notesTimer); if (ctx) ctx.suspend(); updateUI(); syncLed(); }
  function skip(dir) {
    track = (track + dir + TRACKS.length) % TRACKS.length; save();
    if (playing) { ctx.suspend().then(() => { ctx.resume(); startTrack(false); }); } else updateUI();
  }
  function setVol(v) { vol = v; save(); if (master) master.gain.setTargetAtTime(v * .55, ctx.currentTime, .05); }
  function syncLed() { radioLed.material = mat(playing ? '#7CFF7C' : '#3a1a10', playing ? { emissive: '#7CFF7C', emissiveIntensity: 1 } : {}); }
  function updateUI() {
    $('radio-play').textContent = playing ? '⏸' : '▶';
    $('radio-dial').classList.toggle('off', !playing);
    $('radio-title').textContent = playing ? `♪ ${TRACKS[track].name} · Radio Emillion 87.7 FM · o som que acalma o seu drawdown ♪` : `desligado · proxima: ${TRACKS[track].name}`;
    $('radio-vol').value = Math.round(vol * 100);
  }
  function toggleUI() { $('radio').classList.toggle('open'); updateUI(); }
  return { play, pause, skip, setVol, toggleUI, isPlaying: () => playing };
})();
$('radio-play').onclick = () => (Radio.isPlaying() ? Radio.pause() : Radio.play());
$('radio-next').onclick = () => Radio.skip(1);
$('radio-prev').onclick = () => Radio.skip(-1);
$('radio-vol').oninput = e => Radio.setVol(+e.target.value / 100);
$('radio-close').onclick = () => $('radio').classList.remove('open');

// clique no radio (sem confundir com arrastar a camera)
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  if (ray.intersectObject(radio, true).length) Radio.toggleUI();
});
renderer.domElement.addEventListener('pointermove', e => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  renderer.domElement.style.cursor = ray.intersectObject(radio, true).length ? 'pointer' : '';
});

// ============================================================== preco segundo a segundo (ao vivo)
async function pollTick() {
  if (!live() || !ep || !W3.tvData) return;
  try {
    const tk = await getJSON('data/tick.json'), lastC = ep.bars.at(-1)[4];
    tvA.draw({ ...W3.tvData, big: 'WIN ' + fmt(tk.c), time: tk.server, priceColor: tk.c > lastC ? '#7ee787' : tk.c < lastC ? '#ff9aa2' : '#e6edf3' });
  } catch (e) {}
}
setInterval(pollTick, 1000);

// ============================================================== loop
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(.1, clock.getDelta()), now = performance.now(), tsec = now / 1000;
  // paredes entre a camera e a sala somem
  const cp = camera.position;
  walls.left.visible = cp.x > 0; walls.right.visible = cp.x < W; walls.back.visible = cp.z > 0; walls.front.visible = cp.z < D;
  // traders: respirar, digitar, tremer de estresse, pular de alegria
  for (const a of W3.agents) {
    if (a.sitting) {
      a.body.position.y = Math.sin(tsec * 2.6 + a.j) * .008;
      const spd = 14 * a.typing;
      a.arms[0].rotation.x = Math.PI / 2.4 + Math.sin(tsec * spd) * .06 * a.typing;
      a.arms[1].rotation.x = Math.PI / 2.4 + Math.sin(tsec * spd + 1.5) * .06 * a.typing;
      a.body.position.x = a.moodState === 'stress' ? Math.sin(tsec * 40) * .012 : 0;
    }
    if (a.jump) { a.jump -= dt * 1.6; a.body.position.y = Math.max(0, Math.sin((1 - a.jump) * Math.PI * 2)) * .25; if (a.jump <= 0) a.jump = 0; }
  }
  // telas de codigo rolando
  (W3.screens || []).forEach(s => { if (s?.scrMat.map === s.code.tex) s.code.tex.offset.y = (s.code.tex.offset.y + dt * .15 * (s.codeSpeed || 1)) % 1; });
  // quantico: rack piscando, nucleo pulsando, vapor
  if (Math.floor(tsec * 3) !== W3.rackTick) { W3.rackTick = Math.floor(tsec * 3); W3.qRack.forEach((m, i) => (m.visible = ((i * 7 + W3.rackTick) % 5) > 0)); }
  qCore.scale.setScalar(1 + Math.sin(tsec * 3) * .15); qLight.intensity = 1 + Math.sin(tsec * 3) * .3;
  W3.vapor.forEach(v => { v.t = (v.t + dt * .35) % 1; v.m.position.y = 1.35 + v.t * .9; v.m.material.opacity = Math.sin(v.t * Math.PI) * .35; v.m.scale.setScalar(.6 + v.t * 1.4); });
  // carros la embaixo
  for (const c of W3.cars) {
    const s = ((tsec * c.speed + c.off) % 300) - 150, dir = c.lane;
    if (c.alongX) { c.g.position.set(s * dir, GROUND_Y + .05, c.road + dir * 2); c.g.rotation.y = dir > 0 ? 0 : Math.PI; }
    else { c.g.position.set(c.road + dir * 2, GROUND_Y + .05, s * dir); c.g.rotation.y = dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
  }
  // confete
  for (let i = W3.confetti.length - 1; i >= 0; i--) {
    const q = W3.confetti[i]; q.t += dt; q.v.y -= 9 * dt; q.m.position.addScaledVector(q.v, dt); q.m.rotation.x += dt * 8; q.m.rotation.y += dt * 6;
    if (q.t > 1.6 || q.m.position.y < 0) { scene.remove(q.m); W3.confetti.splice(i, 1); }
  }
  maybeWalk(now); stepWalk(dt);
  // replay: avanca sozinho e passa pro proximo pregao
  if (ep && index?.mode === 'replay' && !studyMode() && now - lastTick >= 1000 / REPLAY_SPEED) {
    const adv = Math.max(1, Math.floor((now - lastTick) / (1000 / REPLAY_SPEED))); lastTick = now;
    if (p < ep.bars.length - 1) { p = Math.min(ep.bars.length - 1, p + adv); render(); }
    else { const k = index.episodes.findIndex(e => e.id === epId); load(index.episodes[(k + 1) % index.episodes.length].id); }
  }
  smoothZoom(dt);
  controls.update();
  renderer.render(scene, camera);
  placeLabels();
  requestAnimationFrame(loop);
}
resize();
const now0 = new Date(); sky(now0.getHours(), now0.getMinutes());
tvA.draw(null); tvB.draw([]);
document.fonts?.ready.then(() => { if (W3.tvData) tvA.draw(W3.tvData); provasKey = ''; if (index) renderProvasTV(); });
poll(); setInterval(poll, 1500);
requestAnimationFrame(loop);

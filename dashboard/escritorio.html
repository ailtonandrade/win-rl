<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escritorio Megazord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020; --panel: #121a2e; --line: #26324d; --text: #eef2ff; --muted: #8a96b3;
    --long: #3b8cff; --short: #ff8a3d; --good: #2ee66b; --bad: #ff4d5e; --gold: #ffd166; --live: #ff3b47;
    --pix: "Press Start 2P", ui-monospace, monospace; --term: "VT323", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0b1020; color: var(--text); font: 14px/1.25 var(--term); overflow: hidden; }
  .app { height: 100vh; display: grid; gap: 8px; padding: 8px;
         grid-template-columns: minmax(0, 1fr) clamp(240px, 22vw, 320px);
         grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top" "scene side"; }
  @media (orientation: portrait), (max-width: 760px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100vh; align-content: start; grid-template-columns: minmax(0, 1fr);
           grid-template-rows: auto auto auto; grid-template-areas: "top" "scene" "side"; }
    .scene { height: auto !important; aspect-ratio: 740 / 530; }
  }
  .box { background: var(--panel); border: 2px solid var(--line); border-radius: 4px; box-shadow: 0 3px 0 #000a; min-width: 0; }

  /* topo */
  .top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 8px 12px; }
  .title { font: 13px var(--pix); color: var(--gold); text-shadow: 2px 2px 0 #000; white-space: nowrap; }
  .badge { font: 8px var(--pix); padding: 4px 6px; border-radius: 3px; background: #26324d; color: #cfd8ff; }
  .badge.ao_vivo { background: #4a1015; color: #ff9aa2; } .badge.ao_vivo::before { content: "● "; color: var(--live); animation: blink 1s infinite; }
  .badge.treino { background: #3d2466; color: #d8b4ff; }
  @keyframes blink { 50% { opacity: .2; } }
  .score { font: 18px var(--pix); text-shadow: 2px 2px 0 #000; }
  .meta { font-size: 18px; color: var(--muted); white-space: nowrap; }
  .spacer { flex: 1; }
  .ctl { display: flex; gap: 6px; align-items: center; }
  select, button, a.btn { font: 16px var(--term); background: #0b1020; color: var(--text); border: 2px solid var(--line);
         border-radius: 3px; padding: 2px 8px; cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { border-color: var(--gold); }
  select { max-width: 190px; }
  input[type=range] { width: 90px; accent-color: var(--gold); }
  .good { color: var(--good); } .bad { color: var(--bad); }

  /* cena */
  .scene { grid-area: scene; position: relative; overflow: hidden; height: 100%;
           background: radial-gradient(900px 500px at 50% 40%, #1c2742 0%, #0b1020 75%); }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg text { font-family: var(--pix); }
  .px { shape-rendering: crispEdges; }
  .fb { transform-box: fill-box; }
  /* trader */
  .breathe { animation: breathe 2.4s steps(2) infinite; }
  @keyframes breathe { 50% { transform: translateY(-1px); } }
  .typeL { animation: typ .28s steps(2) infinite; } .typeR { animation: typ .28s steps(2) infinite .14s; }
  .idle .typeL, .idle .typeR { animation-duration: 1.6s; }
  @keyframes typ { 50% { transform: translateY(-2px); } }
  .shake { animation: shake .18s steps(2) infinite; }
  @keyframes shake { 50% { transform: translateX(1.5px); } }
  .jump { animation: jump .5s ease-out 2; }
  @keyframes jump { 40% { transform: translateY(-7px); } }
  .puff { animation: puff 1.2s ease-out infinite; }
  .puff.d1 { animation-delay: .4s; } .puff.d2 { animation-delay: .8s; }
  @keyframes puff { 0% { opacity: 0; transform: translate(0, 0) scale(.5); } 30% { opacity: .9; } 100% { opacity: 0; transform: translate(4px, -14px) scale(1.4); } }
  .throb { animation: throb .6s ease-in-out infinite alternate; }
  @keyframes throb { to { transform: scale(1.25); } }
  .steam { animation: steam 2.2s ease-out infinite; } .steam.s2 { animation-delay: 1.1s; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(0); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateY(-10px); } }
  .pop { animation: pop .35s ease-out; transform-origin: 50% 100%; }
  @keyframes pop { 0% { transform: scale(.2); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .float { animation: floatup 1.6s ease-out forwards; }
  @keyframes floatup { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-46px); } }
  .code { animation: code 1.1s linear infinite; } .code.fast { animation-duration: .45s; }
  @keyframes code { from { transform: translateY(0); } to { transform: translateY(-20px); } }
  .blinkled { animation: blink 1.2s steps(2) infinite; }
  /* computador quantico */
  .ring { animation: ringpulse 2.4s ease-in-out infinite; }
  @keyframes ringpulse { 50% { opacity: .45; } }
  .vapor { animation: vapor 3s ease-out infinite; } .vapor.v2 { animation-delay: 1s; } .vapor.v3 { animation-delay: 2s; }
  @keyframes vapor { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 25% { opacity: .55; } 100% { opacity: 0; transform: translate(6px, -22px) scale(1.6); } }
  .qspin { animation: qspin 6s linear infinite; }
  @keyframes qspin { 50% { opacity: .55; } }
  .rack { animation: rack .9s steps(2) infinite; } .rack.r2 { animation-delay: .3s; } .rack.r3 { animation-delay: .6s; }
  @keyframes rack { 50% { opacity: .15; } }
  .victory .flash { animation: flash .25s steps(2) 6; }
  @keyframes flash { 50% { opacity: 1; } }
  @keyframes drive { from { transform: translateX(-40px); } to { transform: translateX(var(--w)); } }
  @keyframes driveL { from { transform: translateX(var(--w)); } to { transform: translateX(-40px); } }
  /* ida ao bebedouro */
  .walking .legL { animation: step .32s steps(2) infinite; } .walking .legR { animation: step .32s steps(2) infinite .16s; }
  @keyframes step { 50% { transform: translateY(-2px); } }
  .bubbles circle { animation: bub 1.2s ease-out infinite; }
  @keyframes bub { from { transform: translateY(0); opacity: .9; } to { transform: translateY(-14px); opacity: 0; } }

  .hint { position: absolute; left: 10px; bottom: 8px; font-size: 16px; color: var(--muted); pointer-events: none; }
  .banner { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); font: 12px var(--pix); text-align: center;
            background: #0b1020ee; border: 2px solid var(--line); padding: 16px 20px; display: none; line-height: 1.8; }

  /* lateral */
  .side { grid-area: side; display: grid; gap: 8px; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
  .side h3 { font: 9px var(--pix); color: var(--muted); margin: 0 0 8px; letter-spacing: .05em; }
  .lb { padding: 10px; }
  .lrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; font-size: 19px; padding: 2px 0; }
  .av { width: 18px; height: 18px; border: 2px solid #000; box-shadow: 1px 1px 0 #000; }
  .lrow .v { font-family: var(--pix); font-size: 10px; }
  .lrow.mz { border-top: 2px dashed var(--line); margin-top: 4px; padding-top: 6px; }
  .feed { padding: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .feed .list { overflow: hidden; display: flex; flex-direction: column; gap: 4px; }
  .ev { font-size: 17px; background: #0b1020; border-left: 4px solid var(--line); padding: 2px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ev.win { border-color: var(--good); } .ev.loss { border-color: var(--bad); } .ev.info { border-color: var(--gold); }
  .ev.new { animation: slidein .4s; } @keyframes slidein { from { transform: translateX(30px); opacity: 0; } }
  @media (orientation: portrait), (max-width: 760px) { .side { grid-template-rows: auto auto; } .feed .list { max-height: 260px; } }
</style>
</head>
<body>
<div class="app">
  <div class="box top">
    <span class="title">🏢 ESCRITORIO MEGAZORD</span>
    <span class="badge" id="mode">-</span>
    <span class="meta" id="clock">--</span>
    <span class="score" id="score">0</span><span class="meta" id="score-unit">pts</span>
    <span class="spacer"></span>
    <div class="ctl">
      <select id="episode"></select>
      <label class="meta"><input type="checkbox" id="follow" checked> seguir</label>
      <button id="play">⏸</button>
      <input type="range" id="speed" min="1" max="60" value="8" title="candles por segundo">
      <a class="btn" href="time.html">📊 painel</a>
    </div>
  </div>

  <div class="box scene" id="scene">
    <svg id="svg" viewBox="30 -10 740 530" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="banner" id="banner"></div>
    <div class="hint">espaco: pausa · ← →: candle a candle</div>
  </div>

  <div class="side">
    <div class="box lb"><h3>RANKING DO DIA</h3><div id="leader"></div></div>
    <div class="box feed"><h3>ACONTECENDO</h3><div class="list" id="feed"></div></div>
  </div>
</div>

<script>
// ============================================================== dados e reproducao (mesmo formato do painel)
const $ = id => document.getElementById(id);
const TC = ['#ff6b6b', '#4dabf7', '#51cf66', '#fcc419', '#cc5de8', '#20c997', '#f783ac', '#94d82d', '#ffa94d', '#748ffc'];
const HAIR = ['#3b2314', '#f2d16b', '#1d1d1d', '#a0522d', '#d9d9d9', '#6b3fa0', '#b5651d', '#222', '#c0392b', '#444'];
const SKIN = ['#f1c27d', '#ffdbac', '#c68642', '#e0ac69', '#8d5524', '#f1c27d', '#ffdbac', '#c68642', '#e0ac69', '#8d5524'];
const fmt = (v, d = 0) => v == null || isNaN(v) ? '-' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const sgn = (v, d = 0) => v == null || isNaN(v) ? '-' : (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), d);
let index = null, ep = null, epId = null, byI = new Map(), p = 0, playing = true, lastTick = 0, stamp = 0;
let prev = null;
const live = () => index && index.mode === 'ao_vivo';
const studyMode = () => index && index.mode === 'treino' && index.team?.traders && index.team.phase !== 'rodada concluida';
async function getJSON(u) { const r = await fetch(u + '?t=' + Date.now()); if (!r.ok) throw new Error(r.status); return r.json(); }

async function poll() {
  try {
    const idx = await getJSON('data/index.json');
    if (idx.updated === stamp) return;
    stamp = idx.updated; index = idx;
    $('mode').textContent = { treino: 'TREINO', replay: 'REPLAY', ao_vivo: 'AO VIVO' }[idx.mode] || idx.mode;
    $('mode').className = 'badge ' + idx.mode;
    $('episode').innerHTML = idx.episodes.map(e => `<option value="${e.id}">${e.round != null ? 'R' + e.round + ' ' : ''}${e.day} ${sgn(e.pnl_pts)}</option>`).join('');
    if (epId != null) $('episode').value = epId;
    if (studyMode()) {
      banner(null);
      const tn = idx.team.traders.map(x => x.name);
      if (!S.names || S.names.join() !== tn.join()) build(tn);
      renderStudy();
      return;
    }
    const newest = idx.episodes.at(-1);
    if (!newest) return banner(live() ? 'AGUARDANDO O MERCADO' : 'AGUARDANDO O TIME', idx.live?.status || 'rode o run.bat');
    banner(null);
    if (live()) { if ($('follow').checked || !ep) await load(newest.id); return; }
    if (!ep || S.studying || ($('follow').checked && idx.mode === 'treino' && newest.id !== epId && p >= ep.bars.length - 1))
      await load(idx.mode === 'replay' && !ep ? idx.episodes[0].id : newest.id);
  } catch (e) { console.error(e); banner('SEM DADOS', 'rode o run.bat'); }
}
function banner(a, b) { $('banner').style.display = a ? 'block' : 'none'; if (a) $('banner').innerHTML = a + '<br><span style="font-size:9px;color:#8a96b3">' + (b || '') + '</span>'; }

async function load(id) {
  const meta = index.episodes.find(e => e.id === id); if (!meta) return;
  const fresh = id !== epId;
  ep = await getJSON('data/' + meta.file);
  byI = new Map(ep.steps.map(s => [s.i, s])); epId = id; $('episode').value = id;
  if (fresh || S.studying || !S.names) { build(ep.team.names); prev = null; $('feed').innerHTML = ''; p = live() ? ep.bars.length - 1 : 0; }
  if (live() && $('follow').checked) p = ep.bars.length - 1;
  render();
}

// ============================================================== isometria
const T = 32, W = 13, D = 9, WALL = 128, OX = D * T + 50, OY = 160;
const iso = (x, y, z = 0) => [OX + (x - y) * T, OY + (x + y) * T / 2 - z];
const P = pts => pts.map(q => q.map(v => Math.round(v * 10) / 10).join(',')).join(' ');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
const R = (g, x, y, w, h, fill, extra = {}) => el('rect', { x, y, width: w, height: h, fill, ...extra }, g);
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = c => Math.max(0, Math.min(255, Math.round(f < 0 ? c * (1 + f) : c + (255 - c) * f)));
  return '#' + ((m(r) << 16) | (m(g) << 8) | m(b)).toString(16).padStart(6, '0');
}
// caixa isometrica: face +y (esquerda na tela), face +x (direita) e topo
function box(g, x, y, w, d, h, z0, color, extra = {}) {
  el('polygon', { points: P([iso(x, y + d, z0 + h), iso(x + w, y + d, z0 + h), iso(x + w, y + d, z0), iso(x, y + d, z0)]), fill: shade(color, -.15), ...extra }, g);
  el('polygon', { points: P([iso(x + w, y, z0 + h), iso(x + w, y + d, z0 + h), iso(x + w, y + d, z0), iso(x + w, y, z0)]), fill: shade(color, -.32), ...extra }, g);
  el('polygon', { points: P([iso(x, y, z0 + h), iso(x + w, y, z0 + h), iso(x + w, y + d, z0 + h), iso(x, y + d, z0 + h)]), fill: color, ...extra }, g);
}
// planos das paredes para desenhar "adesivos" (quadros, janela, telao) em perspectiva
const onWallX = (g, y, z) => { const [a, b] = iso(0, y, z); return el('g', { transform: `matrix(1,-0.5,0,1,${a},${b})` }, g); }; // parede da esquerda, u cresce pra direita (y diminui)
const onWallY = (g, x, z) => { const [a, b] = iso(x, 0, z); return el('g', { transform: `matrix(1,0.5,0,1,${a},${b})` }, g); };  // parede da direita
const onFaceY = (g, x, y, z) => { const [a, b] = iso(x, y, z); return el('g', { transform: `matrix(1,0.5,0,1,${a},${b})` }, g); }; // face +y de um objeto

// layout: mesas (x, y) e os traders sentam NA FRENTE (lado +y), de costas pra camera, olhando o PC
const DESKS = [[1.6, 1.5], [4.5, 1.5], [7.4, 1.5], [3.0, 4.6], [5.9, 4.6]];
const DESK_W = 1.9, DESK_D = .95, DESK_H = 24, MON_X = .7, MON_W = .82, SEAT_DX = MON_X + MON_W / 2;
const MZ = [0.82, 0.74];
const S = {};

function build(names) {
  S.names = names; S.studying = false; S.study = {}; S.agents = [];
  const svg = $('svg'); svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  defs.innerHTML = `
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="sky1" offset="0" stop-color="#8fd3ff"/><stop id="sky2" offset="1" stop-color="#e0f4ff"/></linearGradient>
    <radialGradient id="mzglow"><stop offset="0" stop-color="#ffd166" stop-opacity=".55"/><stop offset="1" stop-color="#ffd166" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampglow"><stop offset="0" stop-color="#fff2b3" stop-opacity=".35"/><stop offset="1" stop-color="#fff2b3" stop-opacity="0"/></radialGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dfe6f0"/><stop offset=".6" stop-color="#aab4c4"/><stop offset="1" stop-color="#7d889a"/></linearGradient>`;
  const g = el('g', { class: 'px' }, svg);
  drawRoom(g);

  // objetos com profundidade (de tras pra frente)
  const objs = [];
  objs.push({ d: 10.9, draw: gg => shelf(gg, 9.3, 0.15) });
  objs.push({ d: 12.9, draw: gg => cooler(gg, 12.3, 0.6) });
  objs.push({ d: 6.8, draw: gg => coffee(gg, 0.15, 6.2) });
  objs.push({ d: 8.6, draw: gg => plant(gg, 0.6, 8.0, 1) });
  objs.push({ d: 9.3, draw: gg => plant(gg, 8.8, 0.5, 1.1) });
  names.forEach((nm, j) => {
    const [dx, dy] = DESKS[j % DESKS.length];
    objs.push({ d: dx + dy + 1.4, draw: gg => desk(gg, dx, dy, j) });
    objs.push({ d: dx + dy + 2.3, draw: gg => S.agents[j] = trader(gg, dx + SEAT_DX + .12, dy + DESK_D + .3, j, nm) });
  });
  objs.push({ d: MZ[0] + MZ[1], draw: gg => S.mz = megazord(gg, MZ[0], MZ[1]) });
  objs.sort((a, b) => a.d - b.d).forEach(o => o.draw(g));
  S.night = el('polygon', { points: P([iso(0, 0, WALL + 9), iso(W, 0, WALL + 9), iso(W, 0, 0), iso(W, D, 0), iso(0, D, 0), iso(0, D, WALL + 9)]), fill: '#0a1030', opacity: 0, 'pointer-events': 'none' }, svg);
  S.walkers = el('g', {}, svg);  // quem levanta pra beber agua anda por cima do resto
  S.fx = el('g', {}, svg);
  S.walk = null;
}

// ------------------------------------------------------------- sala
function drawRoom(g) {
  // paredes com lambri, faixa e rodateto
  const wallL = '#d8cdb4', wallR = '#e7ddc6', pane = '#8a6a4a', paneR = '#9c7a56';
  el('polygon', { points: P([iso(0, 0, 0), iso(0, D, 0), iso(0, D, WALL), iso(0, 0, WALL)]), fill: wallL }, g);
  el('polygon', { points: P([iso(0, 0, 0), iso(W, 0, 0), iso(W, 0, WALL), iso(0, 0, WALL)]), fill: wallR }, g);
  el('polygon', { points: P([iso(0, 0, 0), iso(0, D, 0), iso(0, D, 34), iso(0, 0, 34)]), fill: pane }, g);
  el('polygon', { points: P([iso(0, 0, 0), iso(W, 0, 0), iso(W, 0, 34), iso(0, 0, 34)]), fill: paneR }, g);
  for (let y = .5; y < D; y += 1) el('polygon', { points: P([iso(0, y, 6), iso(0, y + .8, 6), iso(0, y + .8, 30), iso(0, y, 30)]), fill: shade(pane, .1) }, g);
  for (let x = .5; x < W; x += 1) el('polygon', { points: P([iso(x, 0, 6), iso(x + .8, 0, 6), iso(x + .8, 0, 30), iso(x, 0, 30)]), fill: shade(paneR, .1) }, g);
  el('polygon', { points: P([iso(0, 0, 34), iso(0, D, 34), iso(0, D, 37), iso(0, 0, 37)]), fill: '#5c4630' }, g);
  el('polygon', { points: P([iso(0, 0, 34), iso(W, 0, 34), iso(W, 0, 37), iso(0, 0, 37)]), fill: '#6b5238' }, g);
  el('polygon', { points: P([iso(0, D, WALL), iso(0, 0, WALL), iso(W, 0, WALL), iso(W, 0, WALL + 9), iso(0, 0, WALL + 9), iso(0, D, WALL + 9)]), fill: '#4a3a2a' }, g);
  // piso de tabuas
  for (let x = 0; x < W; x++) for (let y = 0; y < D; y++) {
    const c = (x * 7 + y * 3) % 5 === 0 ? '#b89468' : (x + y) % 2 ? '#c49f72' : '#caa679';
    el('polygon', { points: P([iso(x, y), iso(x + 1, y), iso(x + 1, y + 1), iso(x, y + 1)]), fill: c }, g);
    for (const f of [.33, .66]) el('line', { x1: iso(x, y + f)[0], y1: iso(x, y + f)[1], x2: iso(x + 1, y + f)[0], y2: iso(x + 1, y + f)[1], stroke: '#a7845a', 'stroke-width': .6 }, g);
  }
  // tapete da equipe (com borda) e area do chefe
  el('polygon', { points: P([iso(1.0, 1.0), iso(9.6, 1.0), iso(9.6, 7.8), iso(1.0, 7.8)]), fill: '#24406e' }, g);
  el('polygon', { points: P([iso(1.3, 1.3), iso(9.3, 1.3), iso(9.3, 7.5), iso(1.3, 7.5)]), fill: '#2e5089' }, g);
  el('polygon', { points: P([iso(1.3, 1.3), iso(9.3, 1.3), iso(9.3, 7.5), iso(1.3, 7.5)]), fill: 'none', stroke: '#ffd166', 'stroke-width': 1, opacity: .5 }, g);

  // telao na parede da esquerda
  const tv = onWallX(g, 8.4, WALL - 12);
  R(tv, -5, -5, 210, 98, '#1b1b1b'); R(tv, -3, -3, 206, 94, '#333');
  R(tv, 0, 0, 200, 88, '#06121f');
  for (let yy = 0; yy < 88; yy += 3) R(tv, 0, yy, 200, 1, '#ffffff', { opacity: .03 });
  S.tvTitle = el('text', { x: 6, y: 13, 'font-size': 7, fill: '#ffd166' }, tv);
  S.tvPrice = el('text', { x: 6, y: 33, 'font-size': 13, fill: '#e6edf3' }, tv);

const DAY = [[0, '#070b24', '#141a3d', 1], [320, '#070b24', '#141a3d', 1], [380, '#ff9e7a', '#ffd3a5', .45], [450, '#79c3ff', '#d9f1ff', 0],

const mix = (a, b, f) => {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const c = s => Math.round(((pa >> s) & 255) * (1 - f) + ((pb >> s) & 255) * f);
  return '#' + ((c(16) << 16) | (c(8) << 8) | c(0)).toString(16).padStart(6, '0');
};
function sky(hh, mm) {

  let k = 0; while (k < DAY.length - 2 && DAY[k + 1][0] <= m) k++;
  const [m0, t0, b0, d0] = DAY[k], [m1, t1, b1, d1] = DAY[k + 1];

  $('sky1').setAttribute('stop-color', mix(t0, t1, f));

  // sol de 6h as 19h, lua de 19h as 6h, em arco
  const W = S.cityW || 248;
  const arc = (a, b) => { const q = ((m - a + 1440) % 1440) / (((b - a + 1440) % 1440) || 1); return [W * q, 40 - Math.sin(Math.PI * q) * 32, q >= 0 && q <= 1]; };
  const [sx, sy, sOn] = arc(360, 1140), [lx, ly] = arc(1140, 360);

  S.sun.setAttribute('opacity', sunUp ? 1 : 0); S.sunHalo.setAttribute('opacity', sunUp ? .25 : 0);

  S.stars.setAttribute('opacity', Math.max(0, dark - .3) * 1.4);

  (S.lampGlows || []).forEach(l => l.setAttribute('opacity', .35 + dark * .65));
}

function events(k, st, done) {

  if (forward) {
    ep.team.names.forEach((nm, j) => {
      const a = st?.tr[j], b = prev.st?.tr[j];
      if (a && b && a.trades > b.trades) {
        const won = a.pnl >= b.pnl;
        floatText(S.agents[j].head, `${won ? '+' : ''}${fmt(a.pnl - b.pnl)}`, won ? '#2ee66b' : '#ff4d5e');
        if (won) celebrate(S.agents[j]);

    });
    for (const t of done.slice(prev.done)) {
      floatText(S.mz.head, `${sgn(t.pts)} PTS`, t.pts > 0 ? '#2ee66b' : '#ff4d5e', 11);
      if (t.pts > 0) { confetti(S.mz.head); victory(); }
      feed(`MEGAZORD ${t.side > 0 ? 'comprou' : 'vendeu'} ${t.entry_time}→${t.exit_time}: ${sgn(t.pts)} pts`, t.pts > 0 ? 'win' : 'loss');
    }
    if (st && prev.st && st.pos !== prev.st.pos && st.pos !== 0)
      feed(`${ep.bars[k][0]} MEGAZORD ${st.pos > 0 ? 'ENTROU COMPRADO' : 'ENTROU VENDIDO'} (${st.pos > 0 ? st.votes.long : st.votes.short} votos)`, 'info');
  }

}

  R(body, -12, -34, 4, 14, shade(a.c, -.18)); R(body, 8, -34, 4, 14, shade(a.c, -.25));
  R(body, -12, -21, 4, 3, a.skin); R(body, 8, -21, 4, 3, a.skin);
  R(body, -3, -40, 6, 4, a.skin);
  const headBack = el('g', {}, body);
  R(headBack, -8, -55, 16, 16, a.hair); R(headBack, -8, -55, 16, 4, shade(a.hair, .25));
  const headFront = el('g', { opacity: 0 }, body);
  R(headFront, -8, -55, 16, 16, a.skin); R(headFront, -8, -56, 16, 5, a.hair);
  R(headFront, -5, -48, 3, 3, '#222'); R(headFront, 2, -48, 3, 3, '#222'); R(headFront, -2, -43, 4, 1.5, '#7a3b2e');
  const cup = R(body, 8, -26, 5, 6, '#fff', { opacity: 0 });
  const sayG = el('g', { opacity: 0 }, g);
  R(sayG, -24, -78, 48, 16, '#fff', { rx: 3, stroke: '#000', 'stroke-width': 1.5 });
  const say = el('text', { x: 0, y: -67, 'font-size': 6, 'text-anchor': 'middle', fill: '#1e63d6' }, sayG);

}
function startWalk(a) {
  const back = a.y < 4;                                  // fileira de tras ou da frente
  const aisle = back ? [[a.x, 3.55], [11.75, 3.55]] : [[a.x, 8.45], [12.55, 8.45], [12.55, 3.55], [11.75, 3.55]];
  const path = [[a.x, a.y], ...aisle, COOLER_SPOT];
  const sp = walkerSprite(a);
  a.seat.setAttribute('opacity', 0);
  S.walk = { a, sp, path: path.concat([...path].reverse().slice(1)), seg: 0, t: 0, drink: 0, last: performance.now(), drank: false };
  feed(`${S.names[a.j]} foi beber agua 💧`, 'info');
}
function stepWalk(now) {
  const w = S.walk; if (!w) return;
  const dt = Math.min(.1, (now - w.last) / 1000); w.last = now;
  const half = (w.path.length - 1) / 2;
  if (w.seg === half && !w.drank) {                      // no bebedouro: para e bebe
    w.drink += dt;
    w.sp.g.classList.remove('walking');
    w.sp.cup.setAttribute('opacity', 1);
    w.sp.cup.setAttribute('y', w.drink % 1.2 < .6 ? -30 : -26);
    w.sp.headBack.setAttribute('opacity', 1); w.sp.headFront.setAttribute('opacity', 0);
    if (!w.bub) {
      w.bub = el('g', { class: 'bubbles' }, S.fx);
      const [cx, cy] = iso(12.3, .6, 52);
      for (let k = 0; k < 4; k++) el('circle', { cx: cx - 4 + k * 3, cy, r: 1.5, fill: '#fff', style: `animation-delay:${k * .25}s` }, w.bub);
      w.sp.sayG.setAttribute('opacity', 1); w.sp.say.textContent = ['glub glub', 'ahhh 💧', 'hidratando'][Math.floor(Math.random() * 3)];
    }
    if (w.drink > 2.6) { w.drank = true; w.bub.remove(); w.sp.cup.setAttribute('opacity', 0); w.sp.sayG.setAttribute('opacity', 0); }
    return;
  }
  const [x0, y0] = w.path[w.seg], [x1, y1] = w.path[w.seg + 1];
  const len = Math.hypot(x1 - x0, y1 - y0) || .01;
  w.t += dt * 1.7 / len;
  if (w.t >= 1) { w.t = 0; w.seg++; if (w.seg >= w.path.length - 1) return endWalk(); return; }
  const x = x0 + (x1 - x0) * w.t, y = y0 + (y1 - y0) * w.t;
  const [sx, sy] = iso(x, y, 0);
  w.sp.g.setAttribute('transform', `translate(${sx},${sy})`);
  w.sp.g.classList.add('walking');
  const towardCam = y1 - y0 > .01;                       // vindo na direcao da camera: mostra o rosto
  w.sp.headBack.setAttribute('opacity', towardCam ? 0 : 1); w.sp.headFront.setAttribute('opacity', towardCam ? 1 : 0);
}
function endWalk() {
  const w = S.walk; if (!w) return;
  w.sp.g.remove(); w.bub?.remove();
  w.a.seat.setAttribute('opacity', 1);
  S.walk = null; S.nextWalk = performance.now() + 8000 + Math.random() * 12000;
}
function maybeWalk(now) {
  if (S.walk || !S.agents?.length) return;
  if (!S.nextWalk) S.nextWalk = now + 5000 + Math.random() * 6000;
  if (now < S.nextWalk) return;
  // so levanta quem nao esta com dinheiro na mesa (estudando, na fila, ou zerado e sem vontade de operar)
  const st = ep && !studyMode() ? byI.get(Math.min(p, ep.bars.length - 1)) : null;
  const free = S.agents.filter((a, j) => {
    if (studyMode()) return true;
    const tr = st?.tr[j];
    return !tr || (tr.pos === 0 && tr.want === 0);
  });
  if (!free.length) { S.nextWalk = now + 3000; return; }
  startWalk(free[Math.floor(Math.random() * free.length)]);
}

// ============================================================== controles
const setPlaying = v => { playing = v; $('play').textContent = v ? '⏸' : '⏵'; };
$('play').onclick = () => { if (ep && p >= ep.bars.length - 1 && !live()) { p = 0; prev = null; } setPlaying(!playing); };
$('episode').onchange = e => { $('follow').checked = false; load(+e.target.value).then(() => setPlaying(true)); };
document.addEventListener('keydown', e => {
  if (!ep || studyMode() || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight') { setPlaying(false); p = Math.min(ep.bars.length - 1, p + 1); render(); }
  if (e.code === 'ArrowLeft') { setPlaying(false); $('follow').checked = false; p = Math.max(0, p - 1); render(); }
});
function loop(ts) {
  maybeWalk(ts); stepWalk(ts);
  if (ep && playing && !studyMode() && !(live() && $('follow').checked)) {
    const iv = 1000 / +$('speed').value;
    if (ts - lastTick >= iv) {
      const adv = Math.max(1, Math.floor((ts - lastTick) / iv)); lastTick = ts;
      if (p < ep.bars.length - 1) { p = Math.min(ep.bars.length - 1, p + adv); render(); }
      else if (index.mode === 'replay' && $('follow').checked) { const nx = index.episodes.find(e => e.id === epId + 1); if (nx) load(nx.id); }
    }
  }
  requestAnimationFrame(loop);
}
poll(); setInterval(poll, 1500); requestAnimationFrame(loop);

; =====================================================================
;  MEGAZORD - configuracao. Edite aqui e rode o run.bat.
;  Linhas com ; sao comentarios.
; =====================================================================

[geral]
; treino  = os traders continuam estudando, rodada apos rodada (Ctrl+C para parar quando quiser)
; replay  = os campeoes jogam os ultimos pregoes do historico, para assistir no painel
; ao_vivo = os campeoes votam a cada candle novo; so mostra no painel, NENHUMA ordem e enviada
MODO = treino

[time]
TRADERS = 5
; quantos traders precisam concordar para o Megazord ENTRAR (comprar ou vender)
VOTOS_PARA_ENTRAR = 4
; posicionado, o Megazord continua enquanto pelo menos este numero ainda quiser o mesmo lado
VOTOS_PARA_MANTER = 2

[mercado]
SIMBOLO = WIN$N
; horario do ULTIMO candle do pregao (18:24 hoje; foi 17:54 em 2022-23 e muda em dias especiais)
FECHAMENTO = 18:24

[regras]
; tempo maximo em posicao, em candles de 1 minuto (scalp)
MAX_HOLD = 15
; pontos "cobrados" a mais em cada entrada, so no aprendizado (desestimula operar demais)
PENALIDADE = 5
MIN_HOLD = 0

[treino]
; passos de estudo de cada trader por rodada (500 mil ~ 20 a 40 min com 5 em paralelo)
PASSOS_POR_RODADA = 500000
; quantas rodadas fazer e parar (0 = continua ate voce fechar)
RODADAS = 0
; baixa os pregoes novos do MT5 antes de cada rodada (precisa do MT5 aberto; se falhar, segue)
ATUALIZAR_DADOS = true
; quantos pregoes de teste (os mais recentes, nunca estudados) usar na prova do time e no replay
DIAS_TESTE_PAINEL = 60

[ao_vivo]
; true  = le os candles do MT5 aberto (conta DEMO) em tempo real
; false = simula: reproduz o ultimo pregao do historico no relogio
CONECTAR_MT5 = false
; ainda nao existe na v1: precisa ficar false
ENVIAR_ORDENS = false
; no modo simulado, quantos candles por segundo
VELOCIDADE_SIMULADA = 2

[painel]
PORTA = 8765
; o que abre no navegador: escritorio (isometrico) ou painel (graficos). Os dois tem link um pro outro.
PAGINA = escritorio
